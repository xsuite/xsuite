name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - v*

jobs:
  build-wheels:
    name: Build wheels for ${{ matrix.pyver }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          ubuntu-latest,
          macos-15-intel,  # x86_64 runners for building x86 wheels
          macos-latest,  # arm64 runners
        ]
        pyver: [cp311, cp312, cp313, cp314]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.pyver }}-*
          CIBW_ENVIRONMENT_PASS_LINUX: LDFLAGS
          LDFLAGS: "-Wl,-S"  # Strip debug symbols: otherwise added by manylinux

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/xsuite
    permissions:
      id-token: write
    outputs:
      is-release: ${{ steps.check-tag.outputs.match }}

    steps:
    - name: Check tag is a public release
      id: check-tag
      run: |
        # Only if a tag matches the pattern vX.Y.Z, upload to PyPI
        if [[ ${{ github.event.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "match=true" >> $GITHUB_OUTPUT
        fi

    - name: Download all the dists
      if: steps.check-tag.outputs.match == 'true'
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist
        merge-multiple: true

    - name: Publish to PyPI
      if: steps.check-tag.outputs.match == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1

  draft-release-notes:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: [publish-to-pypi]
    # Only for public releases (vX.Y.Z) that were uploaded to PyPI
    if: needs.publish-to-pypi.outputs.is-release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # previous tags are needed to find the old pins

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install packaging

      - name: Collate sub-package release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/make_release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2> /dev/null); then
            if [[ $is_draft == true ]]; then
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            else
              echo "Release $GITHUB_REF_NAME is already published, not overwriting its notes."
            fi
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Xsuite $GITHUB_REF_NAME" --notes-file notes.md
          fi
